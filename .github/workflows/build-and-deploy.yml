name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Image info
        run: |
          echo "✅ Pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  deploy:
    needs: build
    runs-on: [self-hosted, linux]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nomad CLI
        uses: hashicorp/setup-nomad@main
        with:
          version: "2.0.4"

      - name: Prepare Vault inputs
        run: |
          set -euo pipefail
          echo "VAULT_CA_B64=$(base64 -w0 /etc/cluster-ca/ca.pem)" >> "$GITHUB_ENV"
          echo "VAULT_ROLE=${GITHUB_REPOSITORY//\//-}" >> "$GITHUB_ENV"

      - name: Mint Nomad token via Vault (GitHub OIDC)
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.service.consul:8200
          caCertificate: ${{ env.VAULT_CA_B64 }}
          method: jwt
          path: jwt-github
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: https://github.com/nightcore-team
          secrets: |
            nomad/creds/deploy-apps secret_id | NOMAD_TOKEN

      - name: Deploy to Nomad
        env:
          NOMAD_ADDR: https://nomad.service.consul:4646
          NOMAD_CACERT: /etc/cluster-ca/ca.pem
          NOMAD_NAMESPACE: apps
        run: |
          nomad job run \
            -var "image_tag=${GITHUB_SHA}" \
            -var "repository=${GITHUB_REPOSITORY}" \
            nomad.hcl
